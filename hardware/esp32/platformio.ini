[platformio]
default_envs = board_only
build_dir = ../../.liferaft/esp32-build
libdeps_dir = ../../.liferaft/esp32-libdeps

[env:board_only]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
; Keep a small standard partition layout; do not enable/use PSRAM for this test.
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 115200
