[platformio]
default_envs = board_only
build_dir = ../../.liferaft/esp32-build
libdeps_dir = ../../.liferaft/esp32-libdeps

[env]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
; Keep a small standard partition layout; do not enable/use PSRAM for this test.
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 115200

[env:board_only]
build_src_filter = +<main.cpp>

[env:button_only]
build_src_filter = +<button_only.cpp>

[env:oled_test]
build_src_filter = +<oled_test.cpp>
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4

; Flash only after the exact board and both accessories have passed bench checks.
[env:edge]
build_src_filter = +<edge.cpp>
lib_deps =
    ${env:oled_test.lib_deps}
    paulstoffregen/OneWire@2.3.8
