[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liferaft"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic==2.12.5", "python-dotenv==1.2.1"]

[project.optional-dependencies]
training = ["torch==2.15.0", "numpy==2.4.1"]

[project.scripts]
liferaft = "liferaft.cli:main"

[tool.setuptools.packages.find]
include = ["liferaft*"]
